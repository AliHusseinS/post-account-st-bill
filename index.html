<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة الرسوم الدراسية | الدراسات العليا</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'sans-serif'] }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Tajawal', sans-serif; }

    /* Scrollbar */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    /* Stat Cards */
    .stat-card {
      @apply bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex-1 text-center;
    }

    /* Student list panel */
    #studentList { height: calc(100vh - 220px); overflow-y: auto; }

    /* Student detail panel */
    #studentDetailPanel { height: calc(100vh - 220px); overflow-y: auto; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.25s ease-out; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

<!-- ================================================================
     TOAST NOTIFICATION
================================================================ -->
<div id="toast"
  class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl text-white font-bold shadow-lg
         transition-all duration-300 opacity-0 pointer-events-none bg-teal-600">
  ‎
</div>

<!-- ================================================================
     LOGIN SCREEN
================================================================ -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-50 to-gray-100">
  <div class="bg-white rounded-3xl shadow-xl p-10 w-full max-w-md fade-in">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-10 h-10 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952
               11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-gray-800">نظام الدراسات العليا</h1>
      <p class="text-sm text-gray-500 mt-1">كلية التخطيط العمراني / المتابعة</p>
    </div>

    <!-- Role Selection -->
    <p class="text-sm font-semibold text-gray-600 mb-3 text-center">اختر الدور</p>
    <div class="grid grid-cols-2 gap-3 mb-5">
      <button data-role="postgrad"
        class="role-btn flex flex-col items-center gap-2 border-2 border-gray-200 rounded-2xl p-4
               hover:border-teal-400 transition-all text-sm font-semibold text-gray-700">
        <svg class="w-7 h-7 text-teal-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2
               2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        قسم الدراسات العليا
      </button>
      <button data-role="accounts"
        class="role-btn flex flex-col items-center gap-2 border-2 border-gray-200 rounded-2xl p-4
               hover:border-teal-400 transition-all text-sm font-semibold text-gray-700">
        <svg class="w-7 h-7 text-teal-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599
               1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        قسم الحسابات
      </button>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="block text-sm text-gray-600 mb-2 font-semibold">كلمة المرور</label>
      <input id="passwordInput" type="password" autocomplete="current-password"
        class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-base focus:outline-none
               focus:border-teal-400 transition-colors"
        placeholder="أدخل كلمة المرور">
    </div>

    <button id="loginBtn"
      class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-2xl
             transition-colors text-base shadow-md">
      تسجيل الدخول
    </button>
  </div>
</div>

<!-- ================================================================
     APP SHELL (hidden until logged in)
================================================================ -->
<div id="appShell" class="hidden min-h-screen flex flex-col">

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-teal-100 rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952
               11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
        </svg>
      </div>
      <div>
        <div class="font-extrabold text-gray-800 text-sm leading-tight">كلية التخطيط العمراني</div>
        <div class="text-xs text-gray-400">الدراسات العليا / المتابعة المالية</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="userBadge" class="text-xs bg-teal-50 text-teal-700 font-semibold px-3 py-1.5 rounded-full border border-teal-200"></span>
      <button id="syncBtn" title="تحديث البيانات"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003
               8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
      <button id="logoutBtn"
        class="text-xs text-red-500 hover:text-red-700 font-semibold px-3 py-1.5 rounded-full
               hover:bg-red-50 transition-colors border border-red-200">
        خروج
      </button>
    </div>
  </header>

  <!-- ============================================================
       STATS BAR
  ============================================================ -->
  <div id="statsBar" class="flex gap-4 px-6 py-4">
    <!-- Filled by JS -->
  </div>

  <!-- ============================================================
       POSTGRAD VIEW
  ============================================================ -->
  <div id="postgradView" class="hidden flex-1 px-6 pb-24">

    <!-- Toolbar -->
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <input id="searchInput" type="text" placeholder="بحث بالاسم أو القسم..."
        class="flex-1 min-w-40 border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white">

      <select id="statusFilter"
        class="border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white">
        <option value="">جميع الحالات</option>
        <option value="paid">مسدد كلياً</option>
        <option value="partial">مسدد جزئياً</option>
        <option value="unpaid">لم يتم التسديد</option>
        <option value="exempt">معفى</option>
      </select>

      <select id="expenseFilter"
        class="border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white">
        <option value="">جميع النفقات</option>
        <option value="نفقة خاصة">نفقة خاصة</option>
        <option value="نفقة عامة">نفقة عامة</option>
      </select>

      <button id="exportExcelBtn"
        class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold
               px-4 py-2 rounded-xl transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        تصدير Excel
      </button>
    </div>

    <!-- Students Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="py-3 px-4 text-right font-semibold text-gray-600">#</th>
            <th class="py-3 px-4 text-right font-semibold text-gray-600">الاسم</th>
            <th class="py-3 px-4 text-right font-semibold text-gray-600">القسم</th>
            <th class="py-3 px-4 text-right font-semibold text-gray-600">النفقة</th>
            <th class="py-3 px-4 text-right font-semibold text-gray-600">نوع الدراسة</th>
            <th class="py-3 px-4 text-right font-semibold text-gray-600">المبلغ المقرر</th>
            <th class="py-3 px-4 text-right font-semibold text-gray-600">الحالة</th>
            <th class="py-3 px-4 text-center font-semibold text-gray-600">إجراءات</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody">
          <tr>
            <td colspan="8" class="py-10 text-center text-gray-400 text-lg">جاري التحميل...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div><!-- /postgradView -->

  <!-- ============================================================
       ACCOUNTS VIEW
  ============================================================ -->
  <div id="accountsView" class="hidden flex-1 px-6 pb-6">
    <div class="flex gap-5 h-full">

      <!-- Left: Student List -->
      <div class="w-80 flex-shrink-0">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="bg-teal-600 text-white text-sm font-bold px-4 py-3 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7
                   20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002
                   5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            قائمة الطلبة
          </div>
          <div id="studentList">
            <!-- filled by JS -->
          </div>
        </div>
      </div>

      <!-- Right: Student Detail -->
      <div class="flex-1 overflow-hidden">
        <div id="studentDetailPanel" class="fade-in">
          <div class="flex items-center justify-center h-64 text-gray-400 text-lg">
            <div class="text-center">
              <div class="text-5xl mb-4">👈</div>
              <div>اختر طالباً من القائمة</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div><!-- /accountsView -->

</div><!-- /appShell -->

<!-- ================================================================
     FAB — Add Student (Postgrad only)
================================================================ -->
<button id="fabAddStudent"
  class="fixed bottom-8 left-8 z-40 w-14 h-14 bg-teal-600 hover:bg-teal-700 text-white rounded-full
         shadow-xl flex items-center justify-center transition-all hover:scale-110"
  title="إضافة طالب">
  <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
  </svg>
</button>

<!-- ================================================================
     ADD STUDENT MODAL
================================================================ -->
<div id="addStudentModal" id="modalOverlay"
  class="hidden fixed inset-0 z-50 bg-black bg-opacity-50 flex items-center justify-center p-4"
  id="modalOverlay">

  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-screen overflow-y-auto fade-in">
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 sticky top-0 bg-white z-10">
      <h2 class="text-lg font-bold text-gray-800">إضافة طالب جديد</h2>
      <button id="closeModalBtn"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form id="addStudentForm" class="px-6 py-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- Full Name -->
        <div class="sm:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 mb-1">الاسم الرباعي <span class="text-red-500">*</span></label>
          <input id="fullNameInput" type="text" required
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400"
            placeholder="أدخل الاسم الرباعي كاملاً">
        </div>

        <!-- Expense Type -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">النفقة <span class="text-red-500">*</span></label>
          <select id="expenseTypeSelect"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400 bg-white">
            <option value="نفقة خاصة">نفقة خاصة — 3,750,000 د.ع</option>
            <option value="نفقة عامة">نفقة عامة — معفى</option>
          </select>
        </div>

        <!-- Total Fee (dynamic) -->
        <div id="feeRow">
          <label class="block text-sm font-semibold text-gray-700 mb-1">المبلغ المقرر الأصلي (د.ع)</label>
          <input id="totalFeeField" type="number" min="0" step="1000"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400"
            placeholder="3750000">
        </div>

        <!-- Department -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">القسم <span class="text-red-500">*</span></label>
          <input id="departmentInput" type="text" required
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400"
            placeholder="مثال: التخطيط الإقليمي">
        </div>

        <!-- Study Type -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">نوع الدراسة</label>
          <select id="studyTypeSelect"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400 bg-white">
            <option value="ماجستير">ماجستير</option>
            <option value="دكتوراه">دكتوراه</option>
          </select>
        </div>

        <!-- Specialization -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">التخصص</label>
          <input id="specializationInput" type="text"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400"
            placeholder="مثال: تخطيط حضري">
        </div>

        <!-- Admission Year -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">سنة القبول</label>
          <input id="admissionYearInput" type="text"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400"
            placeholder="مثال: 2023">
        </div>

        <!-- Graduation Year -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">سنة التخرج (المتوقعة)</label>
          <input id="graduationYearInput" type="text"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-400"
            placeholder="مثال: 2025">
        </div>

      </div>

      <!-- Submit -->
      <div class="mt-6 flex gap-3 justify-end">
        <button type="button" onclick="closeAddStudentModal()"
          class="px-6 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:bg-gray-50 transition-colors">
          إلغاء
        </button>
        <button type="submit"
          class="px-8 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm transition-colors shadow-sm">
          إضافة الطالب
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ================================================================
     APP JS
================================================================ -->
<script src="app.js"></script>

</body>
</html>
